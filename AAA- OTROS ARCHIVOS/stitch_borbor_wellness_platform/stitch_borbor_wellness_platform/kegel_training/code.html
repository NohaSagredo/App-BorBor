<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BorBor - Kegel Training</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "on-primary": "#381e72",
                        "tertiary-container": "#c9a74d",
                        "tertiary-fixed-dim": "#e7c365",
                        "surface-container": "#211f24",
                        "surface-variant": "#36343a",
                        "surface-dim": "#141218",
                        "on-surface": "#e6e0e9",
                        "outline": "#948e9c",
                        "surface-bright": "#3b383e",
                        "primary-fixed": "#e9ddff",
                        "on-primary-fixed": "#22005d",
                        "on-surface-variant": "#cbc4d2",
                        "secondary-fixed": "#e9ddff",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#503d00",
                        "surface-container-high": "#2b292f",
                        "on-secondary": "#342b4b",
                        "outline-variant": "#494551",
                        "on-tertiary-fixed-variant": "#594400",
                        "error-container": "#93000a",
                        "inverse-surface": "#e6e0e9",
                        "on-tertiary": "#3e2e00",
                        "secondary": "#cdc0e9",
                        "tertiary-fixed": "#ffdf93",
                        "secondary-fixed-dim": "#cdc0e9",
                        "surface-container-highest": "#36343a",
                        "surface-container-low": "#1d1b20",
                        "on-error": "#690005",
                        "tertiary": "#e7c365",
                        "background": "#141218",
                        "inverse-primary": "#6750a4",
                        "on-primary-container": "#e0d2ff",
                        "on-secondary-fixed-variant": "#4b4263",
                        "surface": "#141218",
                        "primary-fixed-dim": "#cfbcff",
                        "on-secondary-container": "#bfb2da",
                        "surface-tint": "#cfbcff",
                        "on-background": "#e6e0e9",
                        "inverse-on-surface": "#322f35",
                        "on-tertiary-fixed": "#241a00",
                        "primary-container": "#6750a4",
                        "on-primary-fixed-variant": "#4f378a",
                        "on-secondary-fixed": "#1f1635",
                        "secondary-container": "#4d4465",
                        "primary": "#cfbcff",
                        "surface-container-lowest": "#0f0d13"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "h2": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.08em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "-0.01em", "fontWeight": "400" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "-0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen flex flex-col font-body-md overflow-hidden relative selection:bg-primary/30">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center opacity-70">
<div class="w-[150vw] h-[150vw] bg-primary/10 rounded-full blur-[120px] mix-blend-screen"></div>
</div>
<!-- Minimalist Header (Transactional) -->
<header class="w-full flex justify-between items-center px-container-padding py-stack-md z-10">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container/50 backdrop-blur-xl border border-white/5 text-on-surface hover:bg-surface-container-high transition-all active:scale-95 shadow-[0_4px_20px_rgba(0,0,0,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-on-surface tracking-tight">Endurance</h1>
<div class="w-12 h-12"></div> <!-- Spacer for perfect centering -->
</header>
<!-- Main Training Canvas -->
<main class="flex-1 flex flex-col items-center justify-center z-10 relative px-container-padding">
<!-- Bioluminescent Breathing Circle -->
<div class="relative w-72 h-72 sm:w-96 sm:h-96 flex items-center justify-center">
<!-- Outer Haptic Ripple Cues -->
<div class="absolute inset-0 rounded-full border border-primary/20 scale-[1.35] opacity-50"></div>
<div class="absolute inset-0 rounded-full border border-primary/40 scale-[1.15] shadow-[0_0_50px_rgba(207,188,255,0.15)]"></div>
<!-- Thick Stroke Progress Ring Background -->
<div class="absolute inset-0 rounded-full border-[14px] border-surface-container-highest/60 backdrop-blur-md"></div>
<!-- Active Progress Ring (Simulating high tension during 'CONTRACT') -->
<svg class="absolute inset-0 w-full h-full -rotate-90 drop-shadow-[0_0_15px_rgba(207,188,255,0.6)]" viewbox="0 0 100 100">
<circle class="text-primary" cx="50" cy="50" fill="none" r="43" stroke="currentColor" stroke-dasharray="270" stroke-dashoffset="60" stroke-linecap="round" stroke-width="14"></circle>
</svg>
<!-- Inner Glass Core -->
<div class="absolute inset-5 rounded-full bg-surface-container/30 backdrop-blur-2xl flex flex-col items-center justify-center border border-white/10 shadow-[inset_0_0_40px_rgba(207,188,255,0.1)]">
<!-- State Label -->
<div class="font-label-caps text-label-caps text-primary uppercase tracking-[0.2em] mb-stack-sm drop-shadow-[0_0_8px_rgba(207,188,255,0.5)]">
                    CONTRACT
                </div>
<!-- Timer -->
<div class="font-display text-display text-on-surface tabular-nums">
                    03
                </div>
</div>
</div>
</main>
<!-- Footer Controls & Progress -->
<footer class="w-full px-container-padding pb-stack-lg pt-stack-md z-10 flex flex-col gap-stack-lg">
<!-- Session Progress -->
<div class="w-full flex flex-col gap-stack-sm max-w-md mx-auto">
<div class="flex justify-between font-label-caps text-label-caps text-on-surface-variant uppercase">
<span>Session Progress</span>
<span class="text-primary">60%</span>
</div>
<!-- Progress Bar Track -->
<div class="w-full h-3 bg-surface-container-highest/80 backdrop-blur-sm rounded-full overflow-hidden border border-white/5">
<!-- Progress Bar Fill with Glow -->
<div class="h-full bg-primary w-[60%] rounded-full shadow-[0_0_12px_rgba(207,188,255,0.9)] relative">
<div class="absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-r from-transparent to-white/40"></div>
</div>
</div>
</div>
<!-- Ambient Sound & Playback Controls -->
<div class="flex justify-between items-center max-w-md w-full mx-auto">
<!-- Sound Selector Pill -->
<button class="flex items-center gap-3 px-5 py-3.5 rounded-full bg-surface-container-high/60 backdrop-blur-xl border border-white/10 text-on-surface hover:bg-surface-container-highest transition-all active:scale-95 shadow-[0_8px_30px_rgba(0,0,0,0.3)]">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-caps text-label-caps uppercase">River Flow</span>
</button>
<!-- Play/Pause FAB -->
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-primary text-on-primary hover:bg-primary-fixed transition-all active:scale-90 shadow-[0_0_20px_rgba(207,188,255,0.4)]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</div>
</footer>
</body></html>
