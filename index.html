<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>BorBor</title>
    
    <script>
      // Prevent pinch-to-zoom on iOS Safari and other mobile browsers
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        if (e.scale !== undefined && e.scale !== 1) {
          e.preventDefault();
        } else if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
    
    <!-- Google Fonts: Inter, Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- SPA redirect handler for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          // Preserve the base path (e.g. /App-BorBor/) without stripping the trailing slash
          var basePath = l.pathname.endsWith('/') ? l.pathname : l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1);
          window.history.replaceState(null, null, basePath + decoded.replace(/^\//, '') + l.hash);
        }
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
